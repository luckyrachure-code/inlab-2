<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Online Shopping Store</title>

    <style>
        /* General Styling */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f5f5f5;
        }

        /* Navigation Bar */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background-color: black;
            color: white;
        }

        nav h2 {
            margin: 0;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 10px;
        }

        nav a:hover {
            color: orange;
        }

        /* Welcome Section */
        .hero {
            text-align: center;
            padding: 40px 20px;
            background-color: lightgray;
        }

        .hero h1 {
            animation: move 2s infinite alternate;
        }

        .hero p {
            font-size: 18px;
        }

        /* Buttons */
        button {
            padding: 10px 18px;
            background-color: black;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: orange;
            color: black;
        }

        /* Product Title */
        .title {
            text-align: center;
            margin-top: 30px;
        }

        /* Product Grid */
        .products {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            padding: 20px;
        }

        /* Product Cards */
        .card {
            text-align: center;
            padding: 15px;
            background-color: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            transition: transform 0.3s;
        }

        .card img {
            width: 150px;
            height: 150px;
            object-fit: contain;
        }

        .card:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        .card h3 {
            margin: 10px 0;
        }

        .price {
            color: green;
            font-weight: bold;
        }

        /* Animation */
        @keyframes move {
            from {
                transform: translateX(-20px);
            }

            to {
                transform: translateX(20px);
            }
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 20px;
            margin-top: 20px;
            background-color: black;
            color: white;
        }

        /* Tablet Layout */
        @media (max-width: 768px) {
            .products {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* Mobile Layout */
        @media (max-width: 600px) {
            nav {
                flex-direction: column;
                gap: 15px;
            }

            nav a {
                margin: 5px;
            }

            .products {
                grid-template-columns: 1fr;
            }

            .hero {
                padding: 25px 10px;
            }

            .hero h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <!-- Navigation -->
    <nav>
        <h2>My Store</h2>

        <div>
            <a href="#">Home</a>
            <a href="#products">Products</a>
            <a href="#contact">Contact</a>
        </div>
    </nav>

    <!-- Welcome Section -->
    <section class="hero">
        <h1>Welcome to My Store</h1>
        <p>Best Products at Best Prices</p>
        <button onclick="shopNow()">Shop Now</button>
    </section>

    <!-- Products Section -->
    <h2 class="title" id="products">Our Products</h2>

    <div class="products">

        <div class="card">
            <img src="watch.jpg" alt="Smart Watch">
            <h3>Smart Watch</h3>
            <p class="price">₹199</p>
            <button onclick="buyProduct('Smart Watch')">Buy Now</button>
        </div>

        <div class="card">
            <img src="headphones.jpg" alt="Headphones">
            <h
